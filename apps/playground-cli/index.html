<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>boundsvg — CLI</title>
    <style>
      /* Inline to prevent white flash before external CSS loads */
      html {
        background: #1a1a1a;
      }

      /* ---- App-specific: body layout ---- */
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---- App-specific: github-link (margin-left: auto) ---- */
      .github-link {
        margin-left: auto;
      }

      .license-note {
        font-size: 11px;
        color: #9fb0dc;
        flex-shrink: 0;
      }

      /* ---- Preset stack (3-level segmented buttons) ---- */
      .preset-stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .preset-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preset-row-label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #9fb0dc;
        text-transform: uppercase;
        white-space: nowrap;
        width: 56px;
        flex-shrink: 0;
      }
      .preset-group-nav,
      .preset-source-nav,
      .preset-nav {
        display: flex;
        flex-wrap: wrap;
      }
      .preset-group-nav button,
      .preset-source-nav button,
      .preset-nav button {
        text-decoration: none;
        color: var(--muted);
        border: 1px solid var(--line);
        background: #2d2d2d;
        padding: 4px 10px;
        font-size: 11px;
        cursor: pointer;
        transition: border-color 0.15s;
        border-radius: 0;
        margin-left: -1px;
      }
      .preset-group-nav button:first-child,
      .preset-source-nav button:first-child,
      .preset-nav button:first-child {
        border-radius: 6px 0 0 6px;
        margin-left: 0;
      }
      .preset-group-nav button:last-child,
      .preset-source-nav button:last-child,
      .preset-nav button:last-child {
        border-radius: 0 6px 6px 0;
      }
      .preset-group-nav button:only-child,
      .preset-source-nav button:only-child,
      .preset-nav button:only-child {
        border-radius: 6px;
      }
      .preset-group-nav button:hover,
      .preset-source-nav button:hover,
      .preset-nav button:hover {
        border-color: rgba(34, 211, 238, 0.5);
        color: #a5f3fc;
        z-index: 1;
      }
      .preset-nav button.active {
        border-color: var(--accent);
        color: #1a1a1a;
        background: linear-gradient(90deg, #67e8f9 0%, var(--accent) 100%);
        z-index: 1;
      }
      .preset-group-nav button.active,
      .preset-source-nav button.active {
        border-color: var(--accent);
        color: #1a1a1a;
        background: linear-gradient(90deg, #67e8f9 0%, var(--accent) 100%);
        z-index: 1;
      }

      /* ---- App-specific: toolbar input width ---- */
      .toolbar input[type="text"] {
        width: 120px;
      }

      /* ---- Source metadata panel ---- */
      .source-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        padding: 8px 24px;
        border-bottom: 1px solid var(--line);
        background: #2d2d2d;
        font-size: 12px;
        color: var(--muted);
      }
      .source-meta-tag {
        border: 1px solid #474747;
        border-radius: 999px;
        padding: 2px 8px;
        color: #d4d4d4;
        background: #333333;
        font-weight: 700;
      }
      .source-meta-item {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: min(560px, 100%);
      }
      .source-meta strong {
        color: #9fb0dc;
      }
      .source-meta a {
        color: #93c5fd;
        text-decoration: none;
      }
      .source-meta a:hover {
        text-decoration: underline;
      }
      .source-meta-empty {
        color: #7f91bf;
        font-style: italic;
      }

      /* ---- Main content ---- */
      .main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        min-height: 0;
      }
      @media (max-width: 1000px) {
        .main {
          grid-template-columns: 1fr;
        }
      }

      /* Left column: SVG input + previews */
      .input-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 16px 16px 24px;
        overflow: hidden;
      }
      .output-section h2 {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .output-section-fill {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .view-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 8px;
        flex-shrink: 0;
      }
      .view-tab {
        padding: 6px 12px;
        border: none;
        background: none;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: color 0.15s;
      }
      .view-tab:hover {
        color: var(--text);
      }
      .view-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .view-pane {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: auto;
      }
      .svg-input-highlight {
        flex: 1;
        min-height: 0;
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        color: var(--text);
        font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.5;
        overflow: auto;
        white-space: pre;
        tab-size: 2;
      }
      .output-frame {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: 1;
        min-height: 200px;
        position: relative;
      }
      .output-frame > svg {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        display: block;
      }
      .output-frame > img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .panel-message {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      /* Warnings panel */
      .warnings-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
        font-size: 11px;
        line-height: 1.6;
        max-height: 150px;
        overflow-y: auto;
      }
      .warning-entry {
        padding: 2px 0;
        border-bottom: 1px solid var(--line);
        color: #fbbf24;
      }
      .warning-entry:last-child {
        border-bottom: none;
      }
      .no-warnings {
        color: var(--muted);
        font-style: italic;
      }

      /* ---- Prism.js syntax highlighting for .svg-input-highlight ---- */
      .svg-input-highlight .token.comment,
      .svg-input-highlight .token.prolog,
      .svg-input-highlight .token.doctype,
      .svg-input-highlight .token.cdata {
        color: #6b7fa0;
      }
      .svg-input-highlight .token.punctuation {
        color: #8b9fc6;
      }
      .svg-input-highlight .token.tag {
        color: #7dd3fc;
      }
      .svg-input-highlight .token.tag .token.punctuation {
        color: #5b8fb8;
      }
      .svg-input-highlight .token.attr-name {
        color: #a5b4fc;
      }
      .svg-input-highlight .token.attr-value,
      .svg-input-highlight .token.string {
        color: #86efac;
      }
      .svg-input-highlight .token.number,
      .svg-input-highlight .token.boolean {
        color: #fbbf24;
      }
      .svg-input-highlight .token.keyword,
      .svg-input-highlight .token.operator {
        color: #c084fc;
      }
      .svg-input-highlight .token.function,
      .svg-input-highlight .token.class-name {
        color: #67e8f9;
      }
      .svg-input-highlight .token.builtin {
        color: #f9a8d4;
      }
      .svg-input-highlight .token.script {
        color: #dbeafe;
      }

      /* ---- CLI bottom panel ---- */
      .cli-panel {
        flex-shrink: 0;
        border-top: 1px solid var(--line);
        min-height: 240px;
        max-height: 320px;
        overflow-y: auto;
      }

      /* ---- Terminal-style CLI command ---- */
      .cli-terminal {
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
        font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.7;
        overflow: auto;
        color: #e2e8f0;
      }
      .cli-terminal-titlebar {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #333;
      }
      .cli-terminal-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .cli-terminal-dot.red {
        background: #ef4444;
      }
      .cli-terminal-dot.yellow {
        background: #eab308;
      }
      .cli-terminal-dot.green {
        background: #22c55e;
      }
      .cli-terminal-prompt {
        color: #22c55e;
        user-select: none;
      }
      .cli-terminal-output {
        color: #9ca3af;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed #333;
      }
      .cli-terminal-output .success {
        color: #4ade80;
      }
      .cli-terminal-output .warn {
        color: #fbbf24;
      }
      .cli-terminal-note {
        color: #6b7280;
        font-size: 11px;
        font-style: italic;
        margin-top: 8px;
      }

      /* ---- Loading ---- */
      #status {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
      }
      #app {
        display: none;
        min-height: 100vh;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="status">
      <span>Loading WASM &amp; fonts&hellip;</span>
    </div>

    <div id="app">
      <!-- Header -->
      <header class="header">
        <div class="brand-lockup">
          <img
            class="brand-logo"
            src="/logo/boundsvg-logo-horizontal-violet-muted.svg"
            alt=""
            aria-hidden="true"
          />
          <h1 class="brand">CLI</h1>
        </div>
        <span class="brand-sub">SVG &rarr; boundsvg JSX / React Component</span>
        <span class="license-note"
          >Third-party presets: Fluent UI Emoji (MIT)</span
        >
        <a
          class="github-link"
          href="https://github.com/zakideee/boundsvg"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub repository"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="currentColor"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
        <div class="status-strip" id="status-strip">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text"></span>
        </div>
      </header>

      <!-- Toolbar -->
      <div class="toolbar">
        <label>
          Default Font
          <input type="text" id="opt-default-font" value="NotoSansJP-woff2" />
        </label>
        <label>
          Font Map
          <input type="text" id="opt-font-map" placeholder="css:alias,..." />
        </label>
        <label>
          Wrap
          <select id="opt-wrap">
            <option value="word">word</option>
            <option value="char">char</option>
            <option value="none">none</option>
          </select>
        </label>
        <label>
          Fit
          <select id="opt-fit">
            <option value="shrink">shrink</option>
            <option value="none">none</option>
            <option value="grow">grow</option>
          </select>
        </label>
        <details class="bbox-overlay-menu">
          <summary id="opt-bbox-summary">BBox Overlay: off</summary>
          <fieldset class="bbox-overlay-options" aria-label="BBox Overlay">
            <label>
              <input type="checkbox" name="opt-bbox-part" value="specified" />
              node bounds
            </label>
            <label>
              <input type="checkbox" name="opt-bbox-part" value="layout" />
              text lines
            </label>
            <label>
              <input type="checkbox" name="opt-bbox-part" value="actual" />
              glyph bounds
            </label>
            <label>
              <input type="checkbox" name="opt-bbox-part" value="baseline" />
              baselines
            </label>
          </fieldset>
        </details>
        <label>
          PNG Scale
          <select id="opt-png-scale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
          </select>
        </label>
        <label>
          Text Rendering
          <select id="opt-text-rendering">
            <option value="merged">merged paths</option>
            <option value="glyphs">per glyph</option>
          </select>
        </label>
      </div>
      <div class="source-meta" id="source-meta"></div>

      <!-- Content -->
      <div class="main">
        <div class="input-col">
          <div class="output-section">
            <h2>Input SVG</h2>
            <div class="preset-stack">
              <div class="preset-row">
                <span class="preset-row-label">Category</span>
                <nav class="preset-group-nav" id="preset-groups"></nav>
              </div>
              <div class="preset-row">
                <span class="preset-row-label">Source</span>
                <nav class="preset-source-nav" id="preset-sources"></nav>
              </div>
              <div class="preset-row">
                <span class="preset-row-label">Preset</span>
                <nav class="preset-nav" id="presets"></nav>
              </div>
            </div>
          </div>
          <div class="output-section output-section-fill">
            <div class="view-tabs" id="view-tabs">
              <button type="button" class="view-tab active" data-view="preview">
                Preview
              </button>
              <button type="button" class="view-tab" data-view="input">
                Source
              </button>
              <button type="button" class="view-tab" data-view="warnings">
                Warnings
              </button>
            </div>
            <div class="view-pane" id="view-preview">
              <div class="output-frame" id="preview-output"></div>
            </div>
            <div class="view-pane" id="view-input" style="display: none">
              <pre
                class="svg-input-highlight"
                id="svg-input-highlight"
              ><code></code></pre>
            </div>
            <textarea id="svg-input" style="display: none"></textarea>
            <div class="view-pane" id="view-warnings" style="display: none">
              <div class="warnings-panel" id="warnings-output">
                <span class="no-warnings">No warnings</span>
              </div>
            </div>
          </div>
        </div>
        <div class="code-col">
          <div class="code-tabs" id="code-tabs">
            <button
              type="button"
              class="code-tab active"
              data-tab="component"
              title="boundsvg convert: @boundsvg/react dependent dynamic component (.tsx)"
            >
              Bound Component
            </button>
            <button
              type="button"
              class="code-tab"
              data-tab="scene"
              title="boundsvg convert --format scene: VNode tree as JSON (.scene.json)"
            >
              Scene
            </button>
            <span class="code-tab-divider"></span>
            <button
              type="button"
              class="code-tab"
              data-tab="svg"
              title="boundsvg export --format svg: text converted to paths (.svg)"
            >
              SVG
            </button>
            <button
              type="button"
              class="code-tab"
              data-tab="png"
              title="boundsvg export --format png: rasterized PNG (.png)"
            >
              PNG
            </button>
            <button
              type="button"
              class="code-tab"
              data-tab="tsx"
              title="boundsvg export --format static-component: zero-dependency static React component (.tsx)"
            >
              Static Component
            </button>
          </div>
          <div class="code-block" id="code-output"></div>
          <div class="cli-panel" id="cli-panel"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
