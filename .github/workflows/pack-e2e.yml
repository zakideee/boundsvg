name: Pack E2E

on:
  # Manual trigger only: this suite packs and installs real tarballs, so it
  # runs on demand rather than on every push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: |
          pnpm build:wasm
          pnpm build:wasm:web
          pnpm build:wasm:mp4

      - name: Build package outputs and declarations
        run: pnpm typecheck

      - name: Pack, install into a fresh project, and render
        run: node scripts/pack-e2e.mjs
