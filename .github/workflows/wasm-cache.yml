name: Seed WASM cache

# PR-scoped caches are invisible to sibling PRs, so without a main-side
# save a fresh PR can only ever restore a stale WASM artifact. This builds
# and saves the exact-key cache on every main push that changes the WASM
# inputs; PR jobs then restore it (exact hit, or a fresh main fallback via
# restore-keys).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "vendor/**"
      - "crates/boundsvg/build.sh"
      - "package.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Check WASM cache
        id: wasm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/core/wasm-pkg
            crates/boundsvg/pkg-web
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'vendor/**', 'crates/boundsvg/build.sh', 'package.json', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          pnpm build:wasm
          pnpm build:wasm:web
