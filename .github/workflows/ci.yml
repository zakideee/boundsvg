name: CI

on:
  pull_request:
  push:
    branches: ["main", "release/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full CI suite, including coverage and E2E."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      checkout: ${{ steps.detect.outputs.checkout }}
      tree: ${{ steps.detect.outputs.tree }}
      base_ref: ${{ steps.detect.outputs.base_ref }}
      full: ${{ steps.detect.outputs.full }}
      rust: ${{ steps.detect.outputs.rust }}
      ts: ${{ steps.detect.outputs.ts }}
      e2e: ${{ steps.detect.outputs.e2e }}
      pack: ${{ steps.detect.outputs.pack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test CI policy
        run: node --test scripts/ci-policy.test.mjs

      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || 'false' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_CLASSIFICATION_REPORT: target/ci-classification.json
        run: node scripts/ci-policy.mjs classify

      - name: Upload CI classification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-classification
          path: target/ci-classification.json
          if-no-files-found: error

      # The exact base also binds the declaration check to this candidate.
      - name: Output-affecting changes are declared
        shell: bash
        env:
          BASE_REF: ${{ steps.detect.outputs.base_ref }}
        run: bash scripts/check-output-affecting-changeset.sh "${BASE_REF}"

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the docs site
        run: pnpm build:docs

  lint-and-typecheck:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Toolchain only feeds the WASM fallback build; Rust lint/tests run in
      # test-rust, and preflight below runs with --checks-only.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check generated IR contract freshness
        run: pnpm check:ir-schema

      # Restore-only (test-ts saves the exact-key artifact).
      - name: Restore WASM artifacts
        id: wasm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/core/wasm-pkg
            crates/boundsvg/pkg-web
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'vendor/**', 'crates/boundsvg/build.sh', 'package.json', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          # Lint only needs wasm-pkg/pkg-web type surfaces for `pnpm typecheck`;
          # a slightly stale artifact is fine here (test-ts always builds the
          # exact one), so fall back to the newest available instead of paying
          # a full WASM build on every crates change.
          restore-keys: |
            wasm-${{ runner.os }}-

      # Stale fallback types are only safe when the PR does not touch Rust -
      # a crates change may add/alter WASM exports that `pnpm typecheck`
      # references, so exact-miss + rust-changed builds fresh.
      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-matched-key == '' || (steps.wasm-cache.outputs.cache-hit != 'true' && needs.changes.outputs.rust == 'true')
        run: |
          pnpm build:wasm
          pnpm build:wasm:web

      # Seconds to build and not covered by the conditional restore above, so a
      # cache from before the crate existed cannot red a TS-only run.
      - name: Build MP4 muxer WASM
        run: pnpm build:wasm:mp4

      - name: Verify preflight base object
        env:
          PREFLIGHT_BASE: ${{ needs.changes.outputs.base_ref }}
        run: |
          git cat-file -e "${PREFLIGHT_BASE}^{commit}"

      - name: Changed-area preflight
        env:
          PREFLIGHT_BASE: ${{ needs.changes.outputs.base_ref }}
          PREFLIGHT_FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [[ "${PREFLIGHT_FULL}" == "true" ]]; then
            pnpm preflight --full --checks-only --base "${PREFLIGHT_BASE}"
          else
            pnpm preflight --checks-only --base "${PREFLIGHT_BASE}"
          fi

      - name: Knip (unused exports/deps)
        if: needs.changes.outputs.full == 'true'
        run: pnpm knip

  test-ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore WASM artifacts
        id: wasm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/core/wasm-pkg
            crates/boundsvg/pkg-web
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'vendor/**', 'crates/boundsvg/build.sh', 'package.json', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      # ts-only changes still need the WASM artifacts (browser bundles pkg-web,
      # core tests load wasm-pkg) - build only when the cache misses.
      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          pnpm build:wasm
          pnpm build:wasm:web

      - name: Build MP4 muxer WASM
        run: pnpm build:wasm:mp4

      - name: Build package outputs and declarations
        run: pnpm typecheck

      - name: Smoke benchmark harness
        run: pnpm bench:smoke

      - name: Test packed public runtime graph
        if: needs.changes.outputs.pack == 'true'
        run: node scripts/pack-e2e.mjs

      - name: Test shape
        run: pnpm --filter @boundsvg/shape test

      - name: Test core
        if: needs.changes.outputs.full != 'true'
        run: pnpm --filter @boundsvg/core test

      - name: Test browser
        run: pnpm --filter @boundsvg/browser test

      - name: Test worker
        run: pnpm --filter @boundsvg/worker test

      - name: Test video
        run: pnpm --filter @boundsvg/video test

      - name: Test React
        if: needs.changes.outputs.full != 'true'
        run: pnpm --filter @boundsvg/react test

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Require ffmpeg for public CLI integration contracts
        run: ffmpeg -version

      - name: Test CLI
        if: needs.changes.outputs.full != 'true'
        run: pnpm --filter @boundsvg/cli test

      - name: Test extras
        run: pnpm --filter @boundsvg/extras test

      - name: Test public testing helpers
        run: pnpm --filter @boundsvg/testing test

      - name: Test playground Core
        run: pnpm --filter @boundsvg/playground-core test

      - name: Test playground React
        run: pnpm --filter @boundsvg/playground-react test

      - name: Test coverage gates
        if: needs.changes.outputs.full == 'true'
        run: pnpm run test:coverage:ts

      - name: Require all TS coverage summaries
        if: needs.changes.outputs.full == 'true'
        run: |
          test -s packages/core/coverage/coverage-summary.json
          test -s packages/react/coverage/coverage-summary.json
          test -s packages/cli/coverage/coverage-summary.json

      - name: Upload TS coverage summaries
        if: always() && needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ts-summary
          if-no-files-found: error
          path: |
            packages/core/coverage/coverage-summary.json
            packages/react/coverage/coverage-summary.json
            packages/cli/coverage/coverage-summary.json

  test-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: crates/boundsvg

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates/boundsvg

      - name: Test workspace
        if: needs.changes.outputs.full != 'true'
        run: cargo test --workspace
        working-directory: crates/boundsvg

      - name: Test vendored ttf-parser patch
        run: cargo test --manifest-path vendor/ttf-parser/Cargo.toml --all-features

      # Feature-unification contract (was preflight's job before --checks-only):
      # the default-features run above does not cover unicode-full.
      - name: Export contracts (unicode-full)
        run: cargo test -p boundsvg --test lib_exports_test --features unicode-full
        working-directory: crates/boundsvg

      - name: Install llvm-tools-preview
        if: needs.changes.outputs.full == 'true'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.full == 'true'
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov

      - name: Test + Rust coverage
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --lcov --output-path target/llvm-cov/lcov.info
        working-directory: crates/boundsvg

      - name: Upload Rust coverage report
        if: always() && needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-rust-lcov
          if-no-files-found: error
          path: crates/boundsvg/target/llvm-cov/lcov.info

  test-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps firefox

      - name: Build (full chain for E2E)
        run: pnpm run test:e2e:prepare

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-results
          path: e2e/test-results/

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Check prose formatting
        run: pnpm exec prettier --check README.md CONTRIBUTING.md
      - name: Test document link checks
        run: node --test scripts/check-ci-doc-links.test.mjs
      - name: Check local document links
        run: node scripts/check-ci-doc-links.mjs

  ci-acceptance:
    name: CI acceptance
    if: ${{ always() }}
    needs:
      - changes
      - docs-build
      - docs-check
      - lint-and-typecheck
      - test-ts
      - test-rust
      - test-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require expected job results
        env:
          CI_MODE: ${{ needs.changes.outputs.mode }}
          CI_NEEDS: |
            {
              "changes": {
                "result": "${{ needs.changes.result }}",
                "outputs": {
                  "mode": "${{ needs.changes.outputs.mode }}"
                }
              },
              "docs-build": {
                "result": "${{ needs.docs-build.result }}"
              },
              "docs-check": {
                "result": "${{ needs.docs-check.result }}"
              },
              "lint-and-typecheck": {
                "result": "${{ needs.lint-and-typecheck.result }}"
              },
              "test-ts": {
                "result": "${{ needs.test-ts.result }}"
              },
              "test-rust": {
                "result": "${{ needs.test-rust.result }}"
              },
              "test-e2e": {
                "result": "${{ needs.test-e2e.result }}"
              }
            }
        run: node scripts/ci-policy.mjs accept ci
