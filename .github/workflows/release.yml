name: Release

env:
  RELEASE_NPM_CLI_SHA512: 48377f8478372aa1c4e47b763475b135836da82436a5700f2e5e8eb5084fc840f93c7b117eb3ad3b5f7d3194c81b6710a10d59448f6ddbcb21ac3fb672bdc003
  RELEASE_NPM_CLI_VERSION: 11.19.0

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Registry to audit or advance"
        required: true
        type: choice
        default: select-target
        options:
          - select-target
          - npm
          - crates
      release-commit:
        description: "Reviewed single-parent version squash commit (40 lowercase hex)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      target: ${{ steps.admit.outputs.target }}
      report-sha256: ${{ steps.admit.outputs.report-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          path: release-source
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the trusted pre-version controller source
        id: trust-source
        working-directory: release-source
        env:
          EVENT_COMMIT: ${{ github.sha }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-list --parents -n 1 "$RELEASE_COMMIT" | awk '{print NF}')" -eq 2
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$EVENT_COMMIT"
          parent="$(git rev-parse "${RELEASE_COMMIT}^")"
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]]
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.trust-source.outputs.parent }}
          path: trusted-source
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Install the exact audited npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_cli_archive="$RUNNER_TEMP/npm-${RELEASE_NPM_CLI_VERSION}.tgz"
          npm_cli_bin="$RUNNER_TEMP/npm-bin-${RELEASE_NPM_CLI_VERSION}"
          npm_cli_root="$RUNNER_TEMP/npm-cli-${RELEASE_NPM_CLI_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 33554432 \
            "https://registry.npmjs.org/npm/-/npm-${RELEASE_NPM_CLI_VERSION}.tgz" \
            --output "$npm_cli_archive"
          printf '%s  %s\n' "$RELEASE_NPM_CLI_SHA512" "$npm_cli_archive" | sha512sum --check --strict
          mkdir "$npm_cli_bin" "$npm_cli_root"
          tar --extract --gzip --file "$npm_cli_archive" --directory "$npm_cli_root" \
            --strip-components=1 --no-same-owner
          ln -s "$npm_cli_root/bin/npm-cli.js" "$npm_cli_bin/npm"
          test "$("$npm_cli_bin/npm" --version)" = "$RELEASE_NPM_CLI_VERSION"
          printf '%s\n' "$npm_cli_bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: release-source

      - name: Reconstruct admission projection and audited artifacts
        id: admit
        working-directory: trusted-source
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/release-bundle
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release-source
          RELEASE_TARGET: ${{ inputs.target }}
        run: node scripts/release-runtime/workflow-release.mjs admission --target "$RELEASE_TARGET" --release-commit "$RELEASE_COMMIT" --bundle "$BUNDLE_DIRECTORY"

      - name: Carry the exact admission report and audited artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 1

  npm-publish:
    needs: admission
    if: ${{ needs.admission.result == 'success' && needs.admission.outputs.target == 'npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          path: release-source
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the trusted pre-version controller source
        id: trust-source
        working-directory: release-source
        env:
          EVENT_COMMIT: ${{ github.sha }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-list --parents -n 1 "$RELEASE_COMMIT" | awk '{print NF}')" -eq 2
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$EVENT_COMMIT"
          parent="$(git rev-parse "${RELEASE_COMMIT}^")"
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]]
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.trust-source.outputs.parent }}
          path: trusted-source
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Install OIDC-capable npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_cli_archive="$RUNNER_TEMP/npm-${RELEASE_NPM_CLI_VERSION}.tgz"
          npm_cli_bin="$RUNNER_TEMP/npm-bin-${RELEASE_NPM_CLI_VERSION}"
          npm_cli_root="$RUNNER_TEMP/npm-cli-${RELEASE_NPM_CLI_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 33554432 \
            "https://registry.npmjs.org/npm/-/npm-${RELEASE_NPM_CLI_VERSION}.tgz" \
            --output "$npm_cli_archive"
          printf '%s  %s\n' "$RELEASE_NPM_CLI_SHA512" "$npm_cli_archive" | sha512sum --check --strict
          mkdir "$npm_cli_bin" "$npm_cli_root"
          tar --extract --gzip --file "$npm_cli_archive" --directory "$npm_cli_root" \
            --strip-components=1 --no-same-owner
          ln -s "$npm_cli_root/bin/npm-cli.js" "$npm_cli_bin/npm"
          test "$("$npm_cli_bin/npm" --version)" = "$RELEASE_NPM_CLI_VERSION"
          printf '%s\n' "$npm_cli_bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: release-source

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle

      - name: Recheck authority, publish missing npm artifacts, and audit all
        working-directory: trusted-source
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/release-bundle
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release-source
          REPORT_SHA256: ${{ needs.admission.outputs.report-sha256 }}
        run: node scripts/release-runtime/workflow-release.mjs npm --release-commit "$RELEASE_COMMIT" --bundle "$BUNDLE_DIRECTORY" --report-sha256 "$REPORT_SHA256"

  crates-publish:
    needs: admission
    if: ${{ needs.admission.result == 'success' && needs.admission.outputs.target == 'crates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          path: release-source
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the trusted pre-version controller source
        id: trust-source
        working-directory: release-source
        env:
          EVENT_COMMIT: ${{ github.sha }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-list --parents -n 1 "$RELEASE_COMMIT" | awk '{print NF}')" -eq 2
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$EVENT_COMMIT"
          parent="$(git rev-parse "${RELEASE_COMMIT}^")"
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]]
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.trust-source.outputs.parent }}
          path: trusted-source
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Install the exact audited npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_cli_archive="$RUNNER_TEMP/npm-${RELEASE_NPM_CLI_VERSION}.tgz"
          npm_cli_bin="$RUNNER_TEMP/npm-bin-${RELEASE_NPM_CLI_VERSION}"
          npm_cli_root="$RUNNER_TEMP/npm-cli-${RELEASE_NPM_CLI_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 33554432 \
            "https://registry.npmjs.org/npm/-/npm-${RELEASE_NPM_CLI_VERSION}.tgz" \
            --output "$npm_cli_archive"
          printf '%s  %s\n' "$RELEASE_NPM_CLI_SHA512" "$npm_cli_archive" | sha512sum --check --strict
          mkdir "$npm_cli_bin" "$npm_cli_root"
          tar --extract --gzip --file "$npm_cli_archive" --directory "$npm_cli_root" \
            --strip-components=1 --no-same-owner
          ln -s "$npm_cli_root/bin/npm-cli.js" "$npm_cli_bin/npm"
          test "$("$npm_cli_bin/npm" --version)" = "$RELEASE_NPM_CLI_VERSION"
          printf '%s\n' "$npm_cli_bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: release-source

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Recheck authority, publish missing crates, and audit all
        working-directory: trusted-source
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/release-bundle
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release-source
          REPORT_SHA256: ${{ needs.admission.outputs.report-sha256 }}
        run: node scripts/release-runtime/workflow-release.mjs crates --release-commit "$RELEASE_COMMIT" --bundle "$BUNDLE_DIRECTORY" --report-sha256 "$REPORT_SHA256"
