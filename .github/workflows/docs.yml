name: Deploy Site

# Publishes the VitePress docs at the site root and the playground apps under
# /playground/{react,core,cli}/ as one GitHub Pages artifact.

on:
  # Push deploys require GitHub Pages for this repository
  # (Settings → Pages → Source: GitHub Actions); enable both together.
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/**"
  #     - "packages/**"
  #     - "crates/**"
  #     - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages project site is served under /<repo>/.
      SITE_BASE: "/${{ github.event.repository.name }}/"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-pack@0.13.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --- WASM (nodejs + web targets, plus the separate MP4 muxer) ---
      - run: pnpm build:wasm
      - run: pnpm build:wasm:web
      # The video build copies this wasm into its dist, so it has to exist first.
      # Both that dist and wasm-pkg are gitignored, so a fresh checkout has
      # neither and the playground cannot resolve @boundsvg/video without them.
      - run: pnpm build:wasm:mp4

      # --- Library packages consumed by the playgrounds ---
      - name: Build packages
        run: >-
          pnpm
          --filter @boundsvg/core
          --filter @boundsvg/browser
          --filter @boundsvg/worker
          --filter @boundsvg/react
          --filter @boundsvg/shape
          --filter @boundsvg/video
          build

      # --- Playground apps (each under its own Pages subpath) ---
      - name: Build playground-react
        run: pnpm --filter @boundsvg/playground-react build
        env:
          PAGES_BASE: "${{ env.SITE_BASE }}playground/react/"
      - name: Build playground-core
        run: pnpm --filter @boundsvg/playground-core build
        env:
          PAGES_BASE: "${{ env.SITE_BASE }}playground/core/"
      - name: Build playground-cli
        run: pnpm --filter @boundsvg/playground-cli build
        env:
          PAGES_BASE: "${{ env.SITE_BASE }}playground/cli/"

      # --- Docs (Rustdoc is generated, not committed) ---
      - run: pnpm generate:rustdoc
      - name: Build docs
        run: pnpm --filter @boundsvg/docs build
        env:
          DOCS_BASE: "${{ env.SITE_BASE }}"

      # --- Assemble the combined site ---
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/playground/react _site/playground/core _site/playground/cli
          cp -r apps/docs/.vitepress/dist/. _site/
          cp -r apps/playground-react/dist/. _site/playground/react/
          cp -r apps/playground-core/dist/. _site/playground/core/
          cp -r apps/playground-cli/dist/. _site/playground/cli/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
