[package]
name = "boundsvg"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WASM engine for boundsvg — Taffy layout, IR build, SVG/PNG/WebP/GIF emit, WOFF2 decode, rasterization"
authors = ["zakideee"]
repository = "https://github.com/zakideee/boundsvg"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_ir_schema"
path = "src/bin/generate_ir_schema.rs"
required-features = ["ir-schema"]

[dependencies]
boundshape = { path = "../boundshape" }
boundtext = { path = "../boundtext" }
schemars = { version = "=1.2.2", optional = true, features = ["preserve_order"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
taffy = { version = "0.9", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
resvg = { version = "0.45", optional = true }
usvg = { version = "0.45", optional = true }
image-webp = { version = "0.2", optional = true }
gif = { version = "0.13", optional = true }
crc32fast = { version = "1", optional = true }
svgtypes = "0.16"
kurbo = "0.13"
roxmltree = "0.20"
regex = "1"
console_error_panic_hook = "0.1"
thiserror = "2"
woff2 = { package = "woff2-patched", version = "0.4.0" }

[dev-dependencies]
# Decoding side of the roundtrip assertions in tests/. Not linked into the
# shipped wasm.
boundtext = { path = "../boundtext", features = ["phase-trace"] }
image-webp = "0.2"
gif = "0.13"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[features]
default = ["resvg-backend"]
ir-schema = ["dep:schemars", "boundshape/schema", "boundtext/schema"]
resvg-backend = ["dep:resvg", "dep:usvg", "dep:image-webp", "dep:gif", "dep:crc32fast"]
unicode-full = ["boundtext/unicode-full"]
