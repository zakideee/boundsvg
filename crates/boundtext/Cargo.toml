[package]
name = "boundtext"
version = "0.2.0"
authors = ["zakideee"]
repository = "https://github.com/zakideee/boundsvg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multilingual text layout engine — line breaking, kinsoku, vertical text, font shaping, and fit-to-bounds"
keywords = ["text-layout", "shaping", "kinsoku", "japanese", "linebreak"]
categories = ["text-processing"]
exclude = ["reports/", "tools/", "scripts/"]

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
boundshape = { path = "../boundshape", version = "0.2.0" }
schemars = { version = "=1.2.2", optional = true }
rustybuzz = { version = "0.20", optional = true }
self_cell = { version = "1", optional = true }
ttf-parser = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-linebreak = "0.1"

[dependencies.unicode-segmentation]
version = "1.12"
optional = true

[features]
default = ["rustybuzz-backend", "ttfparser-backend", "unicode-full"]
phase-trace = []
rustybuzz-backend = ["dep:rustybuzz", "dep:self_cell"]
schema = ["dep:schemars", "boundshape/schema"]
ttfparser-backend = ["dep:ttf-parser", "dep:self_cell"]
unicode-full = ["unicode-segmentation"]

[[bench]]
name = "text_layout_adversarial"
harness = false
required-features = ["phase-trace"]
