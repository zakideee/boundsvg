[package]
name = "boundtext"
version = "0.5.0"
authors = ["zakideee"]
repository = "https://github.com/zakideee/boundsvg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multilingual text layout engine — line breaking, kinsoku, vertical text, font shaping, and fit-to-bounds"
keywords = ["text-layout", "shaping", "kinsoku", "japanese", "linebreak"]
categories = ["text-processing"]
exclude = ["reports/", "tools/", "scripts/"]

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
boundshape = { path = "../boundshape", version = "0.4.0" }
schemars = { version = "=1.2.2", optional = true }
harfrust = { version = "=0.14.0", optional = true }
skrifa = { version = "=0.48.0", default-features = false, features = ["std"], optional = true }
read-fonts = { version = "=0.45.0", default-features = false, features = ["std", "experimental_font_api"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-linebreak = "0.1"

[dependencies.unicode-segmentation]
version = "1.12"
optional = true

[features]
default = ["harfrust-backend", "skrifa-backend", "unicode-full"]
phase-trace = []
harfrust-backend = ["dep:harfrust", "dep:read-fonts"]
schema = ["dep:schemars", "boundshape/schema"]
skrifa-backend = ["dep:skrifa", "dep:read-fonts"]
unicode-full = ["unicode-segmentation"]

[[bench]]
name = "text_layout_adversarial"
harness = false
required-features = ["phase-trace"]
