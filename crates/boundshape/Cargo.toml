[package]
name = "boundshape"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Low-level geometry and symbol kernel for boundsvg"
keywords = ["geometry", "svg", "path", "boolean"]
categories = ["graphics"]
authors = ["zakideee"]
repository = "https://github.com/zakideee/boundsvg"

[package.metadata.boundsvg-release]
pending-version = "0.3.0"
change-kind = "breaking-public-api"
obligation-id = "shape-failure-authority"

[lints]
workspace = true

[dependencies]
schemars = { version = "=1.2.2", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
schema = ["dep:schemars"]

[dev-dependencies]
proptest = "1"
serde_json = "1"
